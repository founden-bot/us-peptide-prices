# Weekly refresh of data/*.csv from PeptideCompare.co's open-data snapshot, which the site rebuilds every Monday at 14:17 UTC
# and publishes to its Hugging Face dataset (peptidecompare/us-peptide-nad-prices). Commits only when a file changed.
name: Refresh data
on:
  schedule:
    - cron: "40 15 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download the latest snapshot
        run: |
          set -euo pipefail
          for f in prices compounds fda-status research; do
            curl -fsSL -o "data/$f.csv.new" "https://huggingface.co/datasets/peptidecompare/us-peptide-nad-prices/resolve/main/$f.csv"
            # Keep the old file when the new one is empty or lost its header row.
            if [ "$(wc -l < "data/$f.csv.new")" -gt 1 ] && head -1 "data/$f.csv.new" | grep -q '^compound,'; then
              mv "data/$f.csv.new" "data/$f.csv"
            else
              rm -f "data/$f.csv.new"
            fi
          done
      - name: Commit if changed
        run: |
          git config user.name "PeptideCompare.co data"
          git config user.email "hello@peptidecompare.co"
          git add data
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Weekly data refresh $(date -u +%F)"
          git push
